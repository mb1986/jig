[package]
name = "jig-run"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Run commands with arguments taken from a declarative configuration file."
repository = "https://github.com/mb1986/jig"
homepage = "https://github.com/mb1986/jig"
readme = "README.md"
keywords = ["cli", "command-runner", "profile", "kdl", "wrapper"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*.rs",
    "src/completions/*.zsh",
    "src/completions/*.bash",
    "src/completions/*.fish",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SPEC.md",
    "IMPLEMENTATION.md",
]

[[bin]]
name = "jig"
path = "src/main.rs"

[dependencies]
kdl = { version = "6", features = ["v1-fallback"] }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
shlex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
